# Проверка на каждый push в main и на каждый pull request: Biome, типы, менеджер, тесты, установщик.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      # Тесты заголовков менеджера читают собранную SPA (manager/build).
      - run: bun run build:manager
      - run: bun run check
      - name: Установщик
        run: shellcheck install.sh
